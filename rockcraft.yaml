name: forgejo
# see https://documentation.ubuntu.com/rockcraft/en/stable/explanation/bases/
# for more information about bases and using 'bare' bases for chiselled rocks
base: bare
build-base: ubuntu@24.04
version: 9.0.3
license:  GPL-3.0
summary: Forgejo is a self-hosted lightweight software forge.
description: |
    Take back control of your software development process,
    self-host your projects and get everyone involved in delivering quality software on the same page.
platforms: # the platforms this rock should be built on and run on
    amd64:
services:
  forgejo:
    override: replace
    command: forgejo -c /etc/forgejo/app.ini
    startup: enabled
    user: git
    environment:
      FORGEJO_WORK_DIR: /var/lib/forgejo
    on-failure: restart


parts:
    # Separate part for non-chiselled package
    forgejo-deps:
        plugin: nil
        source: .
        stage-packages:
          - git-lfs
        stage:
          - usr/bin/git-lfs

    forgejo:
        after:
          - forgejo-deps
        source: https://codeberg.org/Forgejo/forgejo
        source-tag: v${CRAFT_PROJECT_VERSION}
        source-type: git
        plugin: nil
        build-packages:
          - make
        build-snaps:
          - go/1.23/stable
          - node/22/stable
        stage-packages:
          - git_bins
          - ca-certificates_data
          - base-passwd_data
          - libc6_libs
          - bash_bins
        override-build: |
          # build binary
          # see https://codeberg.org/Codeberg-Infrastructure/forgejo/src/branch/codeberg-9/Dockerfile
          make frontend
          go build contrib/environment-to-ini/environment-to-ini.go
          LDFLAGS="-buildid=" TAGS="bindata timetzdata" make GOFLAGS="-trimpath" RELEASE_VERSION=$CRAFT_PROJECT_VERSION go-check generate-backend static-executable

          # rename binary
          install -d ${CRAFT_PART_INSTALL}/usr/bin/
          mv ${CRAFT_PART_BUILD}/gitea ${CRAFT_PART_INSTALL}/usr/bin/forgejo
          # remove rest of the binaries?
          # add custom user as in docs
          groupadd --root ${CRAFT_PART_INSTALL} git
          useradd -d /var/lib/forgejo -s /bin/bash --root ${CRAFT_PART_INSTALL} -u 1000 -g git git

          # repository dir
          # chown git:git ${CRAFT_PART_INSTALL}/var/lib/forgejo
          install -d -m 0750 -o 1000 -g 1000  ${CRAFT_PART_INSTALL}/var/lib/forgejo

          # config dir
          # chown root:git ${CRAFT_PART_INSTALL}/etc/forgejo
          install -d -m 0770 -o 0 -g 1000  ${CRAFT_PART_INSTALL}/etc/forgejo

          # fake usrmerge
          ln -s -r ${CRAFT_PART_INSTALL}/usr/lib ${CRAFT_PART_INSTALL}/lib
          ln -s -r ${CRAFT_PART_INSTALL}/usr/lib64 ${CRAFT_PART_INSTALL}/lib64
          ln -s -r ${CRAFT_PART_INSTALL}/usr/bin ${CRAFT_PART_INSTALL}/bin

          # create tmpdir
          install -d -m 0777 ${CRAFT_PART_INSTALL}/tmp
